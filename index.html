<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ant Colony Procedural Animation</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div id="canvas-container">
    <canvas id="pheromone-canvas"></canvas>
    <canvas id="main-canvas"></canvas>
  </div>

  <div class="ui-panel" id="ui-panel">
    <div class="panel-header" id="panel-header">
      <h1>Ant Colony Simulation</h1>
      <button id="toggle-panel-btn" title="Toggle Panel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 12 12 18 6 12"></polyline>
        </svg>
      </button>
    </div>

    <div class="panel-content" id="panel-content">
      <div class="control-group">
        <label for="speed-slider">Animation Speed: <span id="speed-value">1x</span></label>
        <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1">
      </div>

      <div class="control-group">
        <label for="evaporation-slider">Evaporation Rate: <span id="evaporation-value">0.001</span></label>
        <input type="range" id="evaporation-slider" min="0.0001" max="0.01" step="0.0001" value="0.001">
      </div>

      <button id="add-food-btn" class="action-btn food-btn">Add Food Source</button>
      <button id="add-ants-btn" class="action-btn ant-btn">Add Ants</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
